<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>LocAR 02 - GPS & Sensors Test</title>
  <!-- Three.js and Location Engine via CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.5/three.js/build/ar-threex-location-only.js"></script>
  <style>
    body { margin: 0; overflow: hidden; font-family: sans-serif; }
    #status {
      position: absolute; top: 10px; left: 10px; z-index: 10;
      background: rgba(0,0,0,0.75); color: white; padding: 12px 16px;
      border-radius: 8px; font-size: 14px; max-width: 85%; line-height: 1.4;
    }
    #start-btn {
      position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%);
      z-index: 20; padding: 16px 32px; font-size: 18px; font-weight: bold;
      background: #2563eb; color: white; border: none; border-radius: 50px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }
  </style>
</head>
<body>
  <div id="status">Press the button below to initialize camera and GPS sensors.</div>
  <button id="start-btn">Start AR Test</button>

  <script>
    const statusBox = document.getElementById('status');
    const startBtn = document.getElementById('start-btn');

    startBtn.addEventListener('click', async () => {
      startBtn.style.display = 'none';

      // Request iOS sensor permissions if needed
      if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        try {
          const perm = await DeviceOrientationEvent.requestPermission();
          if (perm !== 'granted') {
            statusBox.innerText = 'Device orientation permission denied.';
            return;
          }
        } catch (e) { console.error(e); }
      }

      init();
    });

    function init() {
      statusBox.innerText = 'Waiting for GPS fix and camera stream...';

      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(80, window.innerWidth / window.innerHeight, 0.1, 1000);
      const renderer = new THREE.WebGLRenderer({ canvas: document.createElement('canvas'), antialias: true, alpha: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      document.body.appendChild(renderer.domElement);

      const locar = new THREEx.LocationBased(scene, camera);
      const cam = new THREEx.WebcamRenderer(renderer);
      const orientationControls = new THREEx.DeviceOrientationControls(camera);

      let boxesAdded = false;

      locar.on('gpsupdate', (pos) => {
        const lat = pos.coords.latitude;
        const lon = pos.coords.longitude;
        statusBox.innerHTML = `<b>GPS Locked!</b><br>Lat: ${lat.toFixed(5)}, Lon: ${lon.toFixed(5)}<br>Rotate phone to find the 4 colored boxes:`;

        if (!boxesAdded) {
          boxesAdded = true;
          const dist = 0.0005; // ~50-55 meters away

          const createBox = (color, lonOffset, latOffset) => {
            const geom = new THREE.BoxGeometry(10, 10, 10);
            const mat = new THREE.MeshBasicMaterial({ color: color });
            const mesh = new THREE.Mesh(geom, mat);
            locar.add(mesh, lon + lonOffset, lat + latOffset, 0);
          };

          // 1. North: Red
          createBox(0xff0000, 0, dist);
          // 2. South: Yellow
          createBox(0xffff00, 0, -dist);
          // 3. East: Green
          createBox(0x00ff00, dist, 0);
          // 4. West: Cyan / Blue
          createBox(0x00ffff, -dist, 0);
        }
      });

      locar.on('gpserror', (err) => {
        statusBox.innerText = `GPS Error: ${err.message}`;
      });

      locar.startGps();

      function animate() {
        requestAnimationFrame(animate);
        cam.update();
        orientationControls.update();
        renderer.render(scene, camera);
      }
      requestAnimationFrame(animate);
    }
  </script>
</body>
</html>
